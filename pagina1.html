<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Homem-Aranha: De Volta ao Lar - Thiago Oliveira">
    <title>Homem-Aranha: De Volta ao Lar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --spidey-red: #b3121e;
            --spidey-blue: #0e2a6b;
        }

        body {
            background: linear-gradient(180deg, #f5f5f5 0%, #e9e9e9 100%);
        }

        .navbar-spidey {
            background: linear-gradient(90deg, var(--spidey-red), var(--spidey-blue));
        }

        .card {
            border-width: 2px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            box-shadow: 0 0.75rem 1.5rem rgba(179, 18, 30, 0.15);
        }

        .card-img-top {
            transition: transform 0.3s ease;
        }

        .card-img-top:hover {
            transform: scale(1.02);
        }

        h1#tituloFilme {
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .section-title {
            display: inline-block;
            border-bottom: 3px solid var(--spidey-red);
            padding-bottom: 4px;
        }

        #btnSentidoAranha {
            font-weight: 600;
            transition: transform 0.15s ease;
        }

        #btnSentidoAranha:active {
            transform: scale(0.96);
        }

        #btnSentidoAranha.ativo {
            background-color: var(--spidey-blue);
            border-color: var(--spidey-blue);
            animation: pulse 0.6s ease;
        }

        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(14, 42, 107, 0.5); }
            100% { box-shadow: 0 0 0 20px rgba(14, 42, 107, 0); }
        }

        .nav-links a {
            min-width: 160px;
        }

        footer {
            font-size: 0.85rem;
            color: #777;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-spidey mb-4 shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🕸️ Projeto Site Turma</span>
        </div>
    </nav>

    <main class="container">
        <article class="card shadow-sm border-danger mb-5">
            <img src="images.jpg" class="card-img-top mx-auto mt-3 rounded"
                 alt="Capa do filme Homem-Aranha: De Volta ao Lar"
                 style="max-height: 400px; width: auto; object-fit: contain;"
                 loading="lazy">

            <div class="card-body text-center">
                <h1 id="tituloFilme" class="text-danger">Homem-Aranha: De Volta ao Lar</h1>
                <p class="card-text">
                    Peter Parker Sempre foi meu super herói favorito, desde a infância
                </p>

                <hr>

                <section class="my-4">
                    <h3 class="section-title text-dark">Eu e meu amigo Peter, salvando o Queens</h3>
                    <img src="foto-amigos.jpeg" class="img-fluid rounded shadow mt-3"
                         alt="Eu e Peter salvando o Queens"
                         style="max-height: 350px;"
                         loading="lazy">
                </section>

                <hr>

                <div class="d-flex justify-content-center gap-2 flex-wrap nav-links">
                    <a href="index.html" class="btn btn-outline-secondary">← Página Anterior</a>
                    <a href="pagina_do_colega_posterior.html" class="btn btn-outline-secondary">Próxima Página →</a>
                </div>

                <br>
                <button id="btnSentidoAranha" class="btn btn-danger" type="button">
                    Ativar Sentido Aranha
                </button>
                <p id="statusSentido" class="mt-2 fw-semibold" aria-live="polite"></p>
            </div>
        </article>

        <footer class="text-center mb-4">
            Trabalho Desenvolvimento Híbrido — Thiago Oliveira
        </footer>
    </main>

    <script>
        const botao = document.getElementById('btnSentidoAranha');
        const status = document.getElementById('statusSentido');
        let ativo = false;

        botao.addEventListener('click', function () {
            ativo = !ativo;
            botao.classList.toggle('ativo', ativo);

            if (ativo) {
                botao.textContent = 'Desativar Sentido Aranha';
                status.textContent = '🕷️ Sentido Aranha ativado! Pronto para o combate.';
                status.style.color = 'var(--spidey-blue)';
            } else {
                botao.textContent = 'Ativar Sentido Aranha';
                status.textContent = 'Sentido Aranha desativado.';
                status.style.color = '#555';
            }
        });
    </script>
</body>
</html>
